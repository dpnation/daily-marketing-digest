name: Daily Marketing Digest

on:
  schedule:
    # GitHub often starts scheduled jobs hours late, especially on the hour.
    # Three off-the-hour attempts so at least one lands before the morning briefing.
    # (ET = UTC-5 in winter, UTC-4 in summer.) Later runs just refresh the page with any new stories.
    - cron: "17 6 * * *"
    - cron: "43 8 * * *"
    - cron: "37 10 * * *"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: digest-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        run: python generate_digest.py

      - name: Commit and push updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to index.html — nothing to commit today."
            exit 0
          fi

          git commit -m "Daily digest: $(date +'%Y-%m-%d')"
          git pull --rebase origin main

          if ! git push; then
            echo "::error::git push failed — the digest did NOT update. This almost always means repo Workflow permissions got reset to read-only. Go to Settings > Actions > General > Workflow permissions and select 'Read and write permissions', then re-run this workflow."
            exit 1
          fi

          echo "✅ Digest pushed successfully for $(date +'%Y-%m-%d')."
